# Carnet Media — configuration à coller dans Container Manager (Projet → Créer).
# Aucune donnée secrète ici : les jetons d'appareils et le certificat sont créés DANS le conteneur
# et stockés dans le dossier de données du NAS.
#
# À adapter avant de coller (2 valeurs) :
#   - 192.168.1.20 : adresse IP locale du NAS
#   - 1026:100     : utilisateur:groupe Synology propriétaire du dossier de données (voir README)
services:
  carnet-media:
    image: ghcr.io/kabot83/carnet-media:0.2.0
    container_name: carnet-media
    restart: unless-stopped
    user: "1026:100"
    environment:
      CARNET_PORT: "8443"
      CARNET_MAX_DURATION_S: "600"      # 10 min par vidéo au plus
      CARNET_MAX_MB: "200"              # 200 Mo par vidéo au plus
      CARNET_MAX_STORAGE_GB: "200"      # espace total réservé au service
      CARNET_JOBS_PER_HOUR: "30"        # demandes par heure et par appareil
      CARNET_TIKTOK_VIDEO: "true"
      CARNET_CORS_ORIGINS: "https://localhost,https://kabot83.github.io"
    volumes:
      - /volume1/docker/carnet-media/data:/data
    ports:
      # Écoute limitée à l'adresse locale du NAS : rien n'est publié vers Internet.
      - "192.168.1.20:8443:8443"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 1536m
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
