name: APK Android

# Compile l'application Android dans le cloud GitHub (aucun Android Studio nécessaire).
# Résultat :
#   - APK « release » signé avec la clé permanente (secrets ANDROID_KEYSTORE_BASE64,
#     ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD), publié dans la
#     version « android » (onglet Releases) : c'est celui à installer sur le téléphone ;
#   - APK « debug » de diagnostic, uniquement dans les « Artifacts » de l'exécution.
# Chaque APK release est vérifié : même signature qu'avant, numéro de version supérieur.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # publication de la version « android » (onglet Releases)

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # Empreinte SHA-256 (publique) du certificat de la clé permanente de Mon Carnet.
      # Si une compilation produisait une autre signature, elle échouerait au lieu de publier
      # un APK impossible à installer par-dessus le précédent.
      EXPECTED_CERT_SHA256: 8025cb7c79521d87b5ad978e1ac5f2d1633ee46dcc196da864078178df527639

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Compiler la version Android (sans service worker)
        run: npm run build:android

      - name: Installer Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Preparer le SDK Android
        # Le SDK est préinstallé sur les machines GitHub : on accepte les licences
        # et on ajoute la plateforme Android 16 (API 36) exigée par Capacitor 8.
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "SDK Android : $ANDROID_HOME"

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Numero de version
        run: |
          # versionCode toujours croissant (minutes écoulées depuis le 1er janvier 2026) :
          # chaque nouvel APK peut s'installer par-dessus le précédent, sans perte de données.
          echo "VERSION_CODE=$(( ( $(date +%s) - 1767225600 ) / 60 ))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Cle de debogage stable
        # Sans clé stable, chaque compilation aurait une signature différente et Android
        # refuserait la mise à jour (désinstallation obligatoire = perte du carnet).
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: moncarnet-debug-keystore-v1

      - name: Compiler l'APK de test (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Compiler l'APK release signe
        if: env.HAS_RELEASE_KEY == 'true'
        working-directory: android
        env:
          MC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # La clé n'existe que le temps de la compilation, hors du dépôt.
          export MC_KEYSTORE_FILE="$RUNNER_TEMP/moncarnet-release.jks"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$MC_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
          rm -f "$MC_KEYSTORE_FILE"

      - name: Verifier la signature et la version
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK" | grep -E "Verified using v2 scheme|Verified using v3 scheme"
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}')
          echo "Empreinte du certificat : $CERT"
          if [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signature inattendue : cet APK ne pourrait pas remplacer la version installée."
            exit 1
          fi
          PREV=$(gh release view android --json assets --jq '.assets[].name' 2>/dev/null | sed -n 's/^MonCarnet-.*-\([0-9]\+\)\.apk$/\1/p' | head -1)
          echo "Version précédente : ${PREV:-aucune} ; nouvelle : $VERSION_CODE"
          if [ -n "$PREV" ] && [ "$VERSION_CODE" -le "$PREV" ]; then
            echo "::error::Le numéro de version doit augmenter pour une mise à jour sans désinstallation."
            exit 1
          fi

      - name: Renommer les APK
        run: |
          mkdir -p apk release
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk/MonCarnet-${VERSION_NAME}-${VERSION_CODE}-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "release/MonCarnet-${VERSION_NAME}-${VERSION_CODE}.apk"
            cp release/*.apk apk/
          fi
          ls -la apk

      - name: Mettre les APK dans les artefacts
        uses: actions/upload-artifact@v7
        with:
          name: MonCarnet-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: apk/*.apk
          retention-days: 30

      - name: Publier la version Android
        if: github.ref == 'refs/heads/master' && env.HAS_RELEASE_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ancienne pré-version de test (APK debug, autre signature) : retirée pour éviter toute confusion.
          gh release delete android-test --yes --cleanup-tag || true
          gh release delete android --yes --cleanup-tag || true
          gh release create android release/*.apk \
            --latest \
            --target "$GITHUB_SHA" \
            --title "Mon Carnet pour Android" \
            --notes "APK signé avec la clé permanente de Mon Carnet, compilé le $(date -u '+%d/%m/%Y à %H:%M') UTC (version ${VERSION_NAME}, code ${VERSION_CODE}). Il s’installe par-dessus la version précédente, données conservées. Empreinte du certificat : ${EXPECTED_CERT_SHA256}"
