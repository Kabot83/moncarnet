
name: Publier Mon Carnet

on:
  push:
    branches: [master]
    # Le service du NAS (nas/) a son propre workflow : il ne relance ni l'APK ni la PWA.
    paths-ignore: ['nas/**', '.github/workflows/carnet-media.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Compiler Mon Carnet
        run: npm run build

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparer les fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
