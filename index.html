<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F2EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1A18" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Mon Carnet — mon livre de recettes personnel." />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Mon Carnet</title>
    <script>
      // Applique le thème avant le premier rendu pour éviter un flash.
      try {
        var t = localStorage.getItem('mc-theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div class="splash" aria-hidden="true"><span>Mon Carnet</span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
